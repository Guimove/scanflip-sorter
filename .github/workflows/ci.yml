name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Aucun droit par défaut : chaque job déclare le strict nécessaire
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint et build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # lecture du code
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          # Pas de cache : il pourrait être empoisonné et contaminer le zip publié
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Validate manifest
        run: npm run validate
      - name: Build zip
        run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: extension
          path: dist/*.zip
          if-no-files-found: error

  zizmor:
    name: Audit des workflows (zizmor)
    # Audit de sécurité des workflows GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # lecture du code
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.32.0 --format=github --persona=pedantic .github/workflows

  lockfile:
    name: Vérification du lockfile des actions
    # Échoue si actions.lock n'est pas à jour ou si un SHA verrouillé ne correspond plus à l'amont
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # lecture du code
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  release:
    name: Release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, zizmor, lockfile]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # création de la release
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: extension
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  publish:
    name: Publication Chrome Web Store
    # Publication Chrome Web Store : environnement protégé (approbation manuelle, tags v* uniquement).
    # Ne fait rien tant que les secrets CWS_* ne sont pas configurés.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, zizmor, lockfile]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: chrome-web-store
    permissions:
      contents: read # lecture du code
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: extension
          path: dist
      - name: Upload and publish
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$EXTENSION_ID" ]; then
            echo "Secrets CWS_* absents, publication Chrome Web Store ignorée."
            exit 0
          fi
          npm ci --ignore-scripts
          ZIP=$(ls dist/*.zip)
          npx --no-install chrome-webstore-upload --source "$ZIP"
